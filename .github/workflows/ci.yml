name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Линтер, тесты, самопроверка
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
      - name: Ruff
        run: |
          python -m pip install ruff==0.16.9
          ruff check . --output-format github
      - name: Тесты
        run: python -m unittest discover -s tests -v
      - name: Самопроверка (WinDivert.dll, iperf3, движок)
        run: python main.py --selftest

  build:
    name: Сборка exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
      - name: PyInstaller
        run: python -m pip install pyinstaller==6.19.0
      - name: Сборка и самопроверка собранного exe
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: BadLink
          path: dist/BadLink-*.zip
          if-no-files-found: error

  release:
    name: Релиз
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: BadLink
          path: dist
      - name: Тег совпадает с версией в netem/__init__.py
        shell: pwsh
        run: |
          $v = (python -c "import netem; print(netem.__version__)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Тег ${{ github.ref_name }} не совпадает с версией $v" }
      - name: Публикация релиза
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist/BadLink-*.zip).FullName --generate-notes --title "BadLink ${{ github.ref_name }}"
